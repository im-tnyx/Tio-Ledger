name: TioLedger
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)"
    OTHER_LDFLAGS: "$(inherited) -framework TioLedgerShared"
targets:
  TioLedger:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tioledger.ios
        INFOPLIST_FILE: iosApp/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          set -e
          if [ "${OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED:-NO}" = "YES" ]; then
            exit 0
          fi
          cd "$SRCROOT/../.."
          ./gradlew :apps:ios:embedAndSignAppleFrameworkForXcode --no-daemon --console=plain
