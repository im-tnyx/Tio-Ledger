name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-lint-test:
    name: Targeted KMP validation
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Compile shared metadata
        run: ./gradlew :shared:core:compileKotlinMetadata :shared:domain:compileKotlinMetadata :shared:finance-engine:compileKotlinMetadata :shared:application:compileKotlinMetadata :shared:data:compileKotlinMetadata :shared:database:compileKotlinMetadata :shared:bootstrap:compileKotlinMetadata :shared:ui:compileKotlinMetadata --no-daemon --console=plain --stacktrace

      - name: Run critical tests
        run: ./gradlew :shared:finance-engine:test :shared:application:test :shared:data:test :shared:ui:test --no-daemon --console=plain --stacktrace

      - name: Ktlint
        run: ./gradlew ktlintCheck --no-daemon --console=plain --stacktrace

      - name: Detekt
        run: ./gradlew detekt --no-daemon --console=plain --stacktrace

  migration-verification:
    name: SQLDelight migration verification
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Inspect baseline database
        run: |
          sqlite3 shared/database/src/commonMain/sqldelight/com/tioledger/database/1.db "PRAGMA integrity_check;"
          sqlite3 shared/database/src/commonMain/sqldelight/com/tioledger/database/1.db "PRAGMA foreign_key_check;"
          sqlite3 shared/database/src/commonMain/sqldelight/com/tioledger/database/1.db "PRAGMA user_version;"

      - name: Verify SQLDelight migrations with diagnostics
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
          JAVA_TOOL_OPTIONS: -Dorg.sqlite.tmpdir=${{ runner.temp }} -Djava.io.tmpdir=${{ runner.temp }}
        run: |
          set -o pipefail
          mkdir -p build/ci-diagnostics

          ./gradlew :shared:database:verifyCommonMainTioLedgerDatabaseMigration \
            --no-daemon \
            --no-parallel \
            --max-workers=1 \
            --console=plain \
            --stacktrace \
            --info > build/ci-diagnostics/gradle.log 2>&1 &
          gradle_pid=$!

          for _ in $(seq 1 480); do
            if ! kill -0 "$gradle_pid" 2>/dev/null; then
              wait "$gradle_pid"
              result=$?
              cat build/ci-diagnostics/gradle.log
              exit "$result"
            fi
            sleep 1
          done

          ps -ef > build/ci-diagnostics/processes.txt
          for java_pid in $(pgrep -f '[j]ava' || true); do
            jcmd "$java_pid" Thread.print > "build/ci-diagnostics/jcmd-${java_pid}.txt" 2>&1 || true
            jstack -l "$java_pid" > "build/ci-diagnostics/jstack-${java_pid}.txt" 2>&1 || true
          done

          kill -QUIT "$gradle_pid" 2>/dev/null || true
          sleep 10
          kill -TERM "$gradle_pid" 2>/dev/null || true
          sleep 5
          kill -KILL "$gradle_pid" 2>/dev/null || true

          cat build/ci-diagnostics/gradle.log
          exit 124

      - name: Upload SQLDelight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqldelight-diagnostics
          path: build/ci-diagnostics
          if-no-files-found: warn
          retention-days: 7
