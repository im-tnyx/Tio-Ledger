name: Mobile debug build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Choose which phone platform to build for testing
        required: true
        type: choice
        options:
          - android
          - ios
  push:
    paths:
      - .github/workflows/ios-debug.yml
      - apps/ios/**
      - shared/**
      - build-logic/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
  pull_request:
    paths:
      - .github/workflows/ios-debug.yml
      - apps/ios/**
      - shared/**
      - build-logic/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts

permissions:
  contents: read

jobs:
  android-debug:
    name: Build Android debug APK
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'android'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build Android debug APK
        run: ./gradlew :apps:android:assembleDebug --no-daemon --console=plain --stacktrace
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tio-ledger-android-debug-apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: apps/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  ios-debug:
    runs-on: macos-15
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'ios'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec apps/ios/project.yml
      - name: Build simulator Debug app
        run: |
          xcodebuild \
            -project apps/ios/TioLedger.xcodeproj \
            -scheme TioLedger \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/TioLedgerDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build unsigned iPhone app for AltServer
        run: |
          xcodebuild \
            -project apps/ios/TioLedger.xcodeproj \
            -scheme TioLedger \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/TioLedgerDeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
          mkdir -p "$RUNNER_TEMP/TioLedgerUnsignedPayload/Payload"
          cp -R "$RUNNER_TEMP/TioLedgerDeviceDerivedData/Build/Products/Debug-iphoneos/TioLedger.app" \
            "$RUNNER_TEMP/TioLedgerUnsignedPayload/Payload/TioLedger.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/TioLedgerUnsignedPayload/Payload" \
            "$RUNNER_TEMP/TioLedger-unsigned.ipa"
      - name: Upload unsigned iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: tio-ledger-ios-unsigned-ipa-for-altserver
          path: ${{ runner.temp }}/TioLedger-unsigned.ipa
          if-no-files-found: error
      - name: Launch on iPhone simulator
        run: |
          device_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(device["udid"] for group in devices.values() for device in group if device["name"].startswith("iPhone")))')"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" "$RUNNER_TEMP/TioLedgerDerivedData/Build/Products/Debug-iphonesimulator/TioLedger.app"
          xcrun simctl launch "$device_id" com.tioledger.ios
          xcrun simctl io "$device_id" screenshot "$RUNNER_TEMP/tio-ledger-ios-launch.png"
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: tio-ledger-ios-simulator-debug
          path: ${{ runner.temp }}/TioLedgerDerivedData/Build/Products/Debug-iphonesimulator/TioLedger.app
          if-no-files-found: error
      - name: Upload simulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: tio-ledger-ios-simulator-launch
          path: ${{ runner.temp }}/tio-ledger-ios-launch.png
          if-no-files-found: error
